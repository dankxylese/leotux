[package]
name = "seccommit-probe"
description = "F-probe: title memory in place under Wine, by section (SEC_COMMIT + OpenExistingHeapFromFileMapping)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Windows only, as `victory-gpu` has it: on Linux the crate is a stub that says
# how to build and run the probe.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints]
workspace = true
